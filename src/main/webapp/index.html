<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Management System</title>
  <meta name="description" content="A simple Contact Management System built with Java Servlets, MySQL, and Tailwind CSS." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Smooth row highlight on hover */
    tbody tr { transition: background-color 0.15s ease; }

    /* Spinner animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }

    /* Toast slide-in */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .toast-enter { animation: slideIn 0.3s ease forwards; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-6 py-5 flex items-center gap-3">
      <!-- icon -->
      <svg class="w-8 h-8 text-indigo-200" fill="none" stroke="currentColor" stroke-width="1.8"
           viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 20h5v-1a4 4 0 00-4-4h-1M9 20H4v-1a4 4 0 014-4h1m4-4a4 4 0 10-8 0 4 4 0 008 0zm6-4a3 3 0 10-6 0 3 3 0 006 0z"/>
      </svg>
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Contact Management System</h1>
        <p class="text-indigo-200 text-sm">AIP Mini-Project · Java Servlets + MySQL</p>
      </div>
    </div>
  </header>

  <!-- ── Toast notification ──────────────────────────────────────────── -->
  <div id="toast"
       class="fixed top-5 right-5 z-50 hidden px-5 py-3 rounded-lg shadow-lg text-white text-sm font-medium max-w-xs toast-enter"
       role="alert" aria-live="polite">
  </div>

  <!-- ── Main content ────────────────────────────────────────────────── -->
  <main class="max-w-5xl mx-auto px-6 py-8 space-y-8">

    <!-- ── Add / Edit Form ─────────────────────────────────────────── -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h2 id="formTitle" class="text-lg font-semibold text-gray-700 mb-5">➕ Add New Contact</h2>

      <form id="contactForm" novalidate class="grid grid-cols-1 sm:grid-cols-3 gap-4">

        <!-- Hidden id field — only set when editing -->
        <input type="hidden" id="contactId" />

        <!-- Name -->
        <div class="flex flex-col gap-1">
          <label for="name" class="text-sm font-medium text-gray-600">Full Name <span class="text-red-500">*</span></label>
          <input id="name" type="text" placeholder="e.g. Alice Johnson"
                 class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                 required />
        </div>

        <!-- Phone -->
        <div class="flex flex-col gap-1">
          <label for="phone" class="text-sm font-medium text-gray-600">Phone Number <span class="text-red-500">*</span></label>
          <input id="phone" type="tel" placeholder="e.g. 9876543210"
                 class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                 required />
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-1">
          <label for="email" class="text-sm font-medium text-gray-600">Email Address <span class="text-red-500">*</span></label>
          <input id="email" type="email" placeholder="e.g. alice@example.com"
                 class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                 required />
        </div>

        <!-- Buttons -->
        <div class="sm:col-span-3 flex gap-3 mt-1">
          <button id="submitBtn" type="submit"
                  class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold px-6 py-2 rounded-lg transition duration-150 flex items-center gap-2">
            <span id="submitLabel">Add Contact</span>
            <svg id="submitSpinner" class="w-4 h-4 spinner hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 018-8v8H4z"/>
            </svg>
          </button>
          <button id="cancelBtn" type="button" onclick="cancelEdit()"
                  class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold px-5 py-2 rounded-lg transition duration-150">
            Cancel
          </button>
        </div>

      </form>
    </section>

    <!-- ── Contacts Table ──────────────────────────────────────────── -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="px-6 py-4 flex items-center justify-between border-b border-gray-100">
        <h2 class="text-lg font-semibold text-gray-700">📋 All Contacts</h2>
        <span id="contactCount" class="text-sm text-gray-400">Loading…</span>
      </div>

      <!-- Loading state -->
      <div id="loadingRow" class="flex justify-center items-center gap-2 py-10 text-gray-400 text-sm">
        <svg class="w-5 h-5 spinner" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
        Fetching contacts…
      </div>

      <!-- Empty state -->
      <div id="emptyRow" class="hidden text-center py-12 text-gray-400 text-sm">
        No contacts found. Add one using the form above.
      </div>

      <!-- Table -->
      <div id="tableWrapper" class="hidden overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-gray-500 uppercase text-xs tracking-wider">
            <tr>
              <th class="px-6 py-3 text-left w-12">#</th>
              <th class="px-6 py-3 text-left">Name</th>
              <th class="px-6 py-3 text-left">Phone</th>
              <th class="px-6 py-3 text-left">Email</th>
              <th class="px-6 py-3 text-center w-36">Actions</th>
            </tr>
          </thead>
          <tbody id="contactsTableBody" class="divide-y divide-gray-50">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- ── JavaScript ──────────────────────────────────────────────────── -->
  <script>
    // ── Config ─────────────────────────────────────────────────────────
    // Update this path if your context root is different.
    const API_URL = '/ContactManagementSystem/api/contacts';

    // ── DOM refs ────────────────────────────────────────────────────────
    const form         = document.getElementById('contactForm');
    const nameInput    = document.getElementById('name');
    const phoneInput   = document.getElementById('phone');
    const emailInput   = document.getElementById('email');
    const contactIdInp = document.getElementById('contactId');
    const formTitle    = document.getElementById('formTitle');
    const submitLabel  = document.getElementById('submitLabel');
    const submitSpinner= document.getElementById('submitSpinner');
    const cancelBtn    = document.getElementById('cancelBtn');
    const tableBody    = document.getElementById('contactsTableBody');
    const tableWrapper = document.getElementById('tableWrapper');
    const loadingRow   = document.getElementById('loadingRow');
    const emptyRow     = document.getElementById('emptyRow');
    const contactCount = document.getElementById('contactCount');

    // ── Toast ────────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = [
        'fixed top-5 right-5 z-50 px-5 py-3 rounded-lg shadow-lg text-white text-sm font-medium max-w-xs toast-enter',
        type === 'success' ? 'bg-green-600' : 'bg-red-500'
      ].join(' ');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.add('hidden'); }, 3500);
    }

    // ── Spinner helpers ──────────────────────────────────────────────────
    function setLoading(loading) {
      submitSpinner.classList.toggle('hidden', !loading);
      document.getElementById('submitBtn').disabled = loading;
    }

    // ── GET — Load all contacts ──────────────────────────────────────────
    async function loadContacts() {
      loadingRow.classList.remove('hidden');
      tableWrapper.classList.add('hidden');
      emptyRow.classList.add('hidden');
      contactCount.textContent = 'Loading…';

      try {
        const res  = await fetch(API_URL);
        const data = await res.json();

        if (!data.success) throw new Error(data.message);

        const contacts = data.contacts;
        contactCount.textContent = contacts.length
          ? `${contacts.length} contact${contacts.length > 1 ? 's' : ''}`
          : '0 contacts';

        loadingRow.classList.add('hidden');

        if (contacts.length === 0) {
          emptyRow.classList.remove('hidden');
          return;
        }

        tableBody.innerHTML = '';
        contacts.forEach((c, idx) => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-indigo-50/40';
          tr.innerHTML = `
            <td class="px-6 py-3 text-gray-400">${idx + 1}</td>
            <td class="px-6 py-3 font-medium text-gray-800">${escHtml(c.name)}</td>
            <td class="px-6 py-3 text-gray-600">${escHtml(c.phone)}</td>
            <td class="px-6 py-3 text-gray-600">${escHtml(c.email)}</td>
            <td class="px-6 py-3 text-center space-x-2">
              <button onclick="editContact(${c.id}, '${escAttr(c.name)}', '${escAttr(c.phone)}', '${escAttr(c.email)}')"
                      class="bg-amber-100 hover:bg-amber-200 text-amber-700 text-xs font-semibold px-3 py-1 rounded-lg transition">
                ✏️ Edit
              </button>
              <button onclick="deleteContact(${c.id})"
                      class="bg-red-100 hover:bg-red-200 text-red-700 text-xs font-semibold px-3 py-1 rounded-lg transition">
                🗑️ Delete
              </button>
            </td>
          `;
          tableBody.appendChild(tr);
        });

        tableWrapper.classList.remove('hidden');

      } catch (err) {
        loadingRow.classList.add('hidden');
        emptyRow.classList.remove('hidden');
        emptyRow.textContent = '⚠️ Could not load contacts: ' + err.message;
        showToast('Failed to load contacts: ' + err.message, 'error');
      }
    }

    // ── POST / PUT — Form submit ─────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name  = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      const email = emailInput.value.trim();
      const id    = contactIdInp.value;

      if (!name || !phone || !email) {
        showToast('Please fill in all fields.', 'error');
        return;
      }

      setLoading(true);

      const isEdit = !!id;
      const payload = isEdit
        ? { id: parseInt(id), name, phone, email }
        : { name, phone, email };

      try {
        const res = await fetch(API_URL, {
          method:  isEdit ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload)
        });
        const data = await res.json();

        if (!data.success) throw new Error(data.message);

        showToast(isEdit ? 'Contact updated successfully!' : 'Contact added successfully!');
        resetForm();
        loadContacts();

      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      } finally {
        setLoading(false);
      }
    });

    // ── Edit — populate form ─────────────────────────────────────────────
    function editContact(id, name, phone, email) {
      contactIdInp.value = id;
      nameInput.value    = name;
      phoneInput.value   = phone;
      emailInput.value   = email;

      formTitle.textContent  = '✏️ Edit Contact';
      submitLabel.textContent = 'Update Contact';
      cancelBtn.classList.remove('hidden');

      // Scroll to form
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });
      nameInput.focus();
    }

    // ── Cancel edit ──────────────────────────────────────────────────────
    function cancelEdit() { resetForm(); }

    function resetForm() {
      form.reset();
      contactIdInp.value     = '';
      formTitle.textContent  = '➕ Add New Contact';
      submitLabel.textContent = 'Add Contact';
      cancelBtn.classList.add('hidden');
    }

    // ── DELETE ───────────────────────────────────────────────────────────
    async function deleteContact(id) {
      if (!confirm('Are you sure you want to delete this contact?')) return;

      try {
        const res  = await fetch(`${API_URL}?id=${id}`, { method: 'DELETE' });
        const data = await res.json();

        if (!data.success) throw new Error(data.message);
        showToast('Contact deleted successfully!');
        loadContacts();

      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    // ── XSS helpers ──────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    // ── Bootstrap ────────────────────────────────────────────────────────
    loadContacts();
  </script>

</body>
</html>
